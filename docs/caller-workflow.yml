name: Learning AI Review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  automatic-review:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: learning-ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run learning AI review
        uses: TarasovVP/learning-pr-ai-reviewer@REVIEWER_COMMIT_SHA
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          activity_id: kmp-reading-list
          review_scope: full_submission
          provider: anthropic
          model: ${{ vars.AI_MODEL }}
          reasoning_effort: medium
          trigger: ${{ github.event.action }}
          requested_by: ${{ github.actor }}
          github_token: ${{ github.token }}
          ai_api_key: ${{ secrets.AI_API_KEY }}

  manual-review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/ai-review' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: learning-ai-review-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Run learning AI review
        uses: TarasovVP/learning-pr-ai-reviewer@REVIEWER_COMMIT_SHA
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.issue.number }}
          activity_id: kmp-reading-list
          review_scope: full_submission
          provider: anthropic
          model: ${{ vars.AI_MODEL }}
          reasoning_effort: medium
          trigger: manual
          requested_by: ${{ github.actor }}
          github_token: ${{ github.token }}
          ai_api_key: ${{ secrets.AI_API_KEY }}
