name: Learning PR AI Reviewer
description: Evidence-based AI review for practical learning assignments

inputs:
  repository:
    description: Repository that owns the Pull Request
    required: true
  pr_number:
    description: Pull Request number
    required: true
  activity_id:
    description: Trusted learning activity identifier
    required: true
  review_scope:
    description: full_submission or pull_request_changes
    required: false
    default: full_submission
  trigger:
    description: opened, ready_for_review, reopened, or manual
    required: true
  requested_by:
    description: Login that requested a manual review
    required: false
    default: ""
  provider:
    description: anthropic or openai
    required: false
    default: anthropic
  model:
    description: Model identifier accepted by the selected provider
    required: true
  reasoning_effort:
    description: Provider-specific reasoning effort
    required: false
    default: medium
  close_submission:
    description: Close the Pull Request before reading submission evidence
    required: false
    default: "true"
  github_token:
    description: Short-lived token from the caller repository
    required: true
  ai_api_key:
    description: API key for the selected AI provider
    required: true

runs:
  using: composite
  steps:
    - name: Validate configuration
      shell: bash
      env:
        REVIEW_GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_AI_KEY: ${{ inputs.ai_api_key }}
      run: |
        test -n "$REVIEW_GITHUB_TOKEN" || { echo "github_token is required"; exit 1; }
        test -n "$REVIEW_AI_KEY" || { echo "ai_api_key is required"; exit 1; }

    - name: Protect submission Pull Request
      if: inputs.close_submission == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWER_ROOT: ${{ github.action_path }}
      run: python3 "$REVIEWER_ROOT/scripts/protect_submission.py"

    - name: Prepare review context
      id: context
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        ACTIVITY_ID: ${{ inputs.activity_id }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        REVIEW_TRIGGER: ${{ inputs.trigger }}
        REVIEW_REQUESTED_BY: ${{ inputs.requested_by }}
        REVIEWER_ROOT: ${{ github.action_path }}
        REVIEW_CONTEXT: ${{ runner.temp }}/learning-pr-review-context
      run: python3 "$REVIEWER_ROOT/scripts/prepare_context.py"

    - name: Run structured AI review
      id: review
      if: steps.context.outputs.ready == 'true'
      shell: bash
      env:
        AI_PROVIDER: ${{ inputs.provider }}
        AI_API_KEY: ${{ inputs.ai_api_key }}
        AI_MODEL: ${{ inputs.model }}
        AI_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        REVIEWER_ROOT: ${{ github.action_path }}
        REVIEW_CONTEXT: ${{ runner.temp }}/learning-pr-review-context
        REVIEW_OUTPUT: ${{ runner.temp }}/learning-pr-review.json
      run: python3 "$REVIEWER_ROOT/scripts/run_review.py"

    - name: Publish advisory result
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWER_ROOT: ${{ github.action_path }}
        REVIEW_CONTEXT: ${{ runner.temp }}/learning-pr-review-context
        REVIEW_OUTPUT: ${{ runner.temp }}/learning-pr-review.json
        REVIEW_PROVIDER: ${{ inputs.provider }}
        REVIEW_MODEL: ${{ inputs.model }}
        WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 "$REVIEWER_ROOT/scripts/publish_review.py"
