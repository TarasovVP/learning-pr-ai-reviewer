name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/learning-pr-ai-reviewer-pycache
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/learning-pr-ai-reviewer-pycache
        run: python3 -m compileall -q scripts tests

      - name: Validate assessment schema
        run: python3 -m json.tool schemas/assessment.schema.json >/dev/null

      - name: Validate learning activity catalog
        run: ruby scripts/validate_catalog.rb
