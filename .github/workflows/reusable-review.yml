name: Reusable Android PR AI Review

on:
  workflow_call:
    inputs:
      repository:
        description: Repository containing the pull request
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number
      trigger:
        description: ready_for_review or manual
        required: true
        type: string
      requested_by:
        description: GitHub login that requested the review
        required: false
        type: string
    secrets:
      AI_API_KEY:
        required: false
      # Temporary compatibility for callers created before provider-neutral configuration.
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: android-pr-ai-review-${{ inputs.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Check out reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: android-pr-ai-reviewer-actions
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Review pull request
        run: ./android-pr-ai-reviewer-actions/gradlew --project-dir android-pr-ai-reviewer-actions run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROVIDER: openai
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_ACTOR: ${{ inputs.requested_by }}
          REVIEW_TRIGGER: ${{ inputs.trigger }}
          AI_MODEL: provider-model
          AI_REASONING_EFFORT: medium
          ALLOWED_REPOSITORIES: ${{ inputs.repository }}
